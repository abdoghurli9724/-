<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مولّد رموز QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg: #05060c;
    --bg-2: #0a0d1a;
    --violet: #7c5cfc;
    --cyan: #3ee6e0;
    --text: #eef0fb;
    --muted: #8890b5;
    --glass: rgba(255,255,255,0.05);
    --glass-border: rgba(255,255,255,0.10);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing: inherit; margin:0; padding:0; }
  html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
  body{
    height:100%;
    min-height:100vh;
    background: radial-gradient(120% 100% at 50% -10%, #131735 0%, var(--bg) 55%, #020208 100%);
    color: var(--text);
    font-family: 'Cairo', sans-serif;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    overflow-x:hidden;
    position:relative;
    padding: 40px 20px;
  }

  /* faint starfield */
  .field{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:
      radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.35) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.25) 50%, transparent 51%),
      radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 85% 20%, rgba(255,255,255,0.2) 50%, transparent 51%),
      radial-gradient(1px 1px at 10% 65%, rgba(255,255,255,0.3) 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 60% 15%, rgba(255,255,255,0.2) 50%, transparent 51%);
    background-size: 100% 100%;
    opacity:0.7;
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width: 520px;
  }

  .eyebrow{
    font-family:'Space Grotesk', sans-serif;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--muted);
    margin-bottom: 18px;
    text-align:center;
  }

  /* the orb */
  .orb-wrap{
    position:relative;
    width: 220px;
    height: 220px;
    perspective: 900px;
    margin-bottom: 28px;
  }
  .orb{
    width:100%;
    height:100%;
    border-radius:50%;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #b7a6ff 0%, var(--violet) 32%, #3d2e9e 65%, #140d3d 100%);
    box-shadow:
      0 0 60px 10px rgba(124,92,252,0.45),
      0 0 120px 40px rgba(62,230,224,0.12),
      inset -12px -12px 40px rgba(0,0,0,0.5),
      inset 8px 8px 30px rgba(255,255,255,0.25);
    transform-style: preserve-3d;
    animation: float 6s ease-in-out infinite, hue 8s ease-in-out infinite;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
  }
  .orb:hover{ transform: scale(1.04) rotateX(4deg); }
  .orb:active{ transform: scale(0.97); }
  .orb.pulsing{
    animation: float 6s ease-in-out infinite, hue 2.2s ease-in-out infinite, ring 1.4s ease-out infinite;
  }
  @keyframes float{
    0%,100%{ transform: translateY(0) rotateX(0deg); }
    50%{ transform: translateY(-10px) rotateX(3deg); }
  }
  @keyframes hue{
    0%,100%{ filter: hue-rotate(0deg) brightness(1); }
    50%{ filter: hue-rotate(35deg) brightness(1.12); }
  }
  @keyframes ring{
    0%{ box-shadow: 0 0 60px 10px rgba(124,92,252,0.45), 0 0 0 0 rgba(62,230,224,0.35), inset -12px -12px 40px rgba(0,0,0,0.5), inset 8px 8px 30px rgba(255,255,255,0.25); }
    100%{ box-shadow: 0 0 60px 10px rgba(124,92,252,0.45), 0 0 0 26px rgba(62,230,224,0), inset -12px -12px 40px rgba(0,0,0,0.5), inset 8px 8px 30px rgba(255,255,255,0.25); }
  }
  @media (prefers-reduced-motion: reduce){
    .orb, .orb.pulsing{ animation: none; }
  }

  .hint{
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 6px;
    text-align:center;
    min-height: 20px;
  }

  /* panel */
  .panel{
    width:100%;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border-radius: 22px;
    padding: 26px;
    display:flex;
    flex-direction:column;
    gap: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    opacity:0;
    transform: translateY(14px) scale(0.98);
    max-height:0;
    overflow:hidden;
    transition: opacity .5s ease, transform .5s cubic-bezier(.2,.8,.2,1), max-height .5s ease, padding .5s ease, margin .5s ease;
  }
  .panel.open{
    opacity:1;
    transform: translateY(0) scale(1);
    max-height: 700px;
    margin-top: 4px;
  }

  label{
    font-size: 13px;
    color: var(--muted);
  }
  .input-row{
    display:flex;
    gap:10px;
  }
  input[type="url"], input[type="text"]{
    flex:1;
    background: rgba(0,0,0,0.35);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: 'Space Grotesk', sans-serif;
    direction: ltr;
    text-align: left;
    outline: none;
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input:focus{
    border-color: var(--cyan);
    box-shadow: 0 0 0 3px rgba(62,230,224,0.18);
  }
  input::placeholder{ color: #55598a; }

  button{
    font-family: 'Cairo', sans-serif;
    font-weight:600;
    font-size: 15px;
    border: none;
    border-radius: 12px;
    padding: 14px 18px;
    cursor:pointer;
    color: #04040a;
    background: linear-gradient(135deg, var(--cyan), var(--violet));
    transition: transform .15s ease, filter .15s ease;
    white-space: nowrap;
  }
  button:hover{ filter: brightness(1.08); }
  button:active{ transform: scale(0.97); }
  button:focus-visible, .orb:focus-visible{
    outline: 2px solid var(--cyan);
    outline-offset: 3px;
  }
  button.secondary{
    background: transparent;
    color: var(--text);
    border: 1px solid var(--glass-border);
  }
  button:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }

  .qr-area{
    display:none;
    flex-direction:column;
    align-items:center;
    gap: 14px;
    padding-top: 6px;
    border-top: 1px solid var(--glass-border);
  }
  .qr-area.show{ display:flex; }
  #qrcode{
    background:#fff;
    padding: 14px;
    border-radius: 16px;
    box-shadow: 0 10px 40px rgba(62,230,224,0.15);
  }
  #qrcode img, #qrcode canvas{ display:block; border-radius: 4px; }

  .qr-link{
    font-size: 12px;
    color: var(--muted);
    word-break: break-all;
    text-align:center;
    direction: ltr;
    max-width: 100%;
  }

  .actions{ display:flex; gap:10px; width:100%; }
  .actions button{ flex:1; }

  footer{
    position:relative;
    z-index:1;
    margin-top: 34px;
    font-size: 12px;
    color: #4d5180;
    text-align:center;
  }

  @media (max-width: 420px){
    .orb-wrap{ width:180px; height:180px; }
    .input-row{ flex-direction:column; }
    .panel{ padding:20px; }
  }
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>

<div class="stage">
  <div class="eyebrow">اضغط على الكرة لإنشاء رمز QR لرابطك</div>

  <div class="orb-wrap">
    <div class="orb" id="orb" role="button" tabindex="0" aria-label="اضغط لإنشاء رمز QR"></div>
  </div>

  <div class="hint" id="hint">اضغط للبدء</div>

  <div class="panel" id="panel">
    <div>
      <label for="urlInput">ضع رابطك هنا</label>
      <div class="input-row" style="margin-top:8px;">
        <input type="url" id="urlInput" placeholder="https://example.com" inputmode="url" autocomplete="off">
      </div>
    </div>

    <button id="generateBtn">إنشاء QR Code</button>

    <div class="qr-area" id="qrArea">
      <div id="qrcode"></div>
      <div class="qr-link" id="qrLink"></div>
      <div class="actions">
        <button id="downloadBtn">تنزيل QR Code</button>
        <button class="secondary" id="resetBtn">رابط جديد</button>
      </div>
    </div>
  </div>
</div>

<footer>امسح الرمز بأي كاميرا هاتف للدخول إلى الرابط</footer>

<script>
(function(){
  const orb = document.getElementById('orb');
  const panel = document.getElementById('panel');
  const hint = document.getElementById('hint');
  const urlInput = document.getElementById('urlInput');
  const generateBtn = document.getElementById('generateBtn');
  const qrArea = document.getElementById('qrArea');
  const qrDiv = document.getElementById('qrcode');
  const qrLink = document.getElementById('qrLink');
  const downloadBtn = document.getElementById('downloadBtn');
  const resetBtn = document.getElementById('resetBtn');

  let qrInstance = null;
  let opened = false;

  function openPanel(){
    if(opened) return;
    opened = true;
    orb.classList.add('pulsing');
    panel.classList.add('open');
    hint.textContent = 'أدخل الرابط ثم اضغط إنشاء';
    setTimeout(()=> urlInput.focus(), 250);
  }

  orb.addEventListener('click', openPanel);
  orb.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPanel(); }
  });

  function normalizeUrl(v){
    v = v.trim();
    if(!v) return null;
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    return v;
  }

  function generate(){
    const val = normalizeUrl(urlInput.value);
    if(!val){
      urlInput.focus();
      urlInput.style.borderColor = '#ff6b6b';
      setTimeout(()=> urlInput.style.borderColor = '', 900);
      return;
    }
    qrDiv.innerHTML = '';
    try{
      qrInstance = new QRCode(qrDiv, {
        text: val,
        width: 200,
        height: 200,
        colorDark: '#0a0d1a',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }catch(err){
      qrLink.textContent = 'تعذّر إنشاء الرمز، حاول مجدداً';
      return;
    }
    qrLink.textContent = val;
    qrArea.classList.add('show');
    orb.classList.remove('pulsing');
    hint.textContent = 'تم إنشاء الرمز بنجاح';
  }

  generateBtn.addEventListener('click', generate);
  urlInput.addEventListener('keydown', (e)=>{ if(e.key === 'Enter'){ e.preventDefault(); generate(); } });

  downloadBtn.addEventListener('click', ()=>{
    const canvas = qrDiv.querySelector('canvas');
    const img = qrDiv.querySelector('img');
    let dataUrl = null;
    if(canvas){ dataUrl = canvas.toDataURL('image/png'); }
    else if(img){ dataUrl = img.src; }
    if(!dataUrl) return;
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'qrcode.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  resetBtn.addEventListener('click', ()=>{
    urlInput.value = '';
    qrArea.classList.remove('show');
    qrDiv.innerHTML = '';
    hint.textContent = 'أدخل الرابط ثم اضغط إنشاء';
    urlInput.focus();
  });
})();
</script>
</body>
</html>
